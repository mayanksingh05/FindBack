version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: findback_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: findback_user
      POSTGRES_PASSWORD: findback_pass
      POSTGRES_DB: findback_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findback_user -d findback_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: findback_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://findback_user:findback_pass@db:5432/findback_db
      SECRET_KEY: ${SECRET_KEY:-findback_production_secret_key_2026}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findback_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
